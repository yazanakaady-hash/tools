[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "re-nexus"
version = "1.0.0"
description = "RE-Nexus — YAZAN Elite System: 29 local reverse-engineering & malware-analysis engines behind one Flask dashboard."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "flask>=3.0",
    "werkzeug>=3.0",
    "psutil>=5.9",
    "cryptography>=42.0",
]

[project.scripts]
re-nexus = "app.server:main"

[tool.setuptools]
packages = ["app", "app.engines"]

[tool.setuptools.package-data]
app = ["../web/**/*", "../samples/*", "../start.bat"]

[tool.ruff]
line-length = 100
target-version = "py39"
